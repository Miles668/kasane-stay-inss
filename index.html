<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accolink | Premium Stays</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root { --emerald-dark: #064e3b; }
        body { background-color: var(--emerald-dark); font-family: 'Inter', sans-serif; color: white; }
        .swiper { width: 100%; height: 280px; border-radius: 20px 20px 0 0; }
        .swiper-slide img { width: 100%; height: 100%; object-fit: cover; }
        .custom-shadow { box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-black tracking-tighter text-emerald-400">ACCOLINK</h1>
            <div class="bg-emerald-900/50 px-4 py-1 rounded-full border border-emerald-500/30 text-xs">
                KASANE, BW
            </div>
        </div>

        <div class="relative mb-10">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-emerald-500"></i>
            <input type="text" id="property-search" 
                   placeholder="Search name or location..." 
                   class="w-full bg-slate-900 border-none p-4 pl-12 rounded-2xl focus:ring-2 focus:ring-emerald-500 transition">
        </div>

        <div id="property-grid" class="space-y-10">
            <div class="text-center py-20 opacity-40">
                <i class="fa-solid fa-circle-notch fa-spin fa-2x mb-4"></i>
                <p>Loading premium guest houses...</p>
            </div>
        </div>
    </div>

    <script>
        // 1. CONFIGURATION (Unique names to avoid 'Already Declared' error)
        const _URL = 'https://vmctxpfqlwqhcdwiqkpg.supabase.com';
        const _KEY = 'sb_publishable_DKgc7fLhpguRjq_xac86hw_F7MzhEjm'; // Note: Ensure this is your ANON key

        const _supabaseInstance = supabase.createClient(_URL, _KEY);

        let propertyData = [];

        // 2. FETCH DATA
        async function getProperties() {
            const { data, error } = await _supabaseInstance
                .from('properties')
                .select('*');

            if (error) {
                console.error("Supabase Error:", error);
                document.getElementById('property-grid').innerHTML = `<p class="text-red-400">Connection error. Check console.</p>`;
                return;
            }

            propertyData = data;
            renderAll(propertyData);
        }

        // 3. RENDER FUNCTION
        function renderAll(list) {
            const grid = document.getElementById('property-grid');
            
            if (list.length === 0) {
                grid.innerHTML = `<p class="text-center opacity-50">No properties found.</p>`;
                return;
            }

            grid.innerHTML = list.map(item => {
                // Handle image list safely
                const images = Array.isArray(item.images) ? item.images : [];
                const slides = images.map(img => `<div class="swiper-slide"><img src="${img}" alt="Property"></div>`).join('');
                
                // Amenities Mapping
                const amens = Array.isArray(item.amenities) ? item.amenities : [];
                
                return `
                    <div class="bg-slate-900 rounded-[30px] overflow-hidden custom-shadow border border-white/5 transition hover:border-emerald-500/50">
                        <div class="swiper mySwiper-${item.id}">
                            <div class="swiper-wrapper">${slides}</div>
                            <div class="swiper-pagination"></div>
                        </div>

                        <div class="p-6">
                            <div class="flex justify-between items-start mb-2">
                                <h2 class="text-2xl font-bold">${item.name}</h2>
                                <div class="flex text-amber-400 text-xs">
                                    ${'<i class="fa-solid fa-star"></i>'.repeat(item.stars || 0)}
                                </div>
                            </div>
                            
                            <p class="text-slate-400 text-sm flex items-center gap-2 mb-4">
                                <i class="fa-solid fa-location-dot text-emerald-500"></i> ${item.location}
                            </p>

                            <div class="flex flex-wrap gap-2 mb-6">
                                ${amens.map(a => `<span class="bg-emerald-900/30 text-emerald-400 text-[10px] uppercase font-bold px-3 py-1 rounded-md">${a}</span>`).join('')}
                            </div>

                            <div class="flex items-center justify-between pt-4 border-t border-white/5">
                                <div>
                                    <p class="text-emerald-400 text-2xl font-black">P${item.price}</p>
                                    <p class="text-slate-500 text-[10px] uppercase tracking-widest">Per Night</p>
                                </div>
                                <button onclick="handleBooking('${item.id}', '${item.whatsapp}')" 
                                        class="bg-emerald-500 hover:bg-emerald-400 text-white px-6 py-3 rounded-2xl font-bold transition transform active:scale-95 shadow-lg shadow-emerald-500/20">
                                    BOOK NOW
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            // Initialize Sliders
            list.forEach(item => {
                new Swiper(`.mySwiper-${item.id}`, {
                    pagination: { el: '.swiper-pagination', clickable: true },
                    loop: true
                });
            });
        }

        // 4. SEARCH LOGIC
        document.getElementById('property-search').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            const filtered = propertyData.filter(p => 
                p.name.toLowerCase().includes(val) || 
                p.location.toLowerCase().includes(val)
            );
            renderAll(filtered);
        });

        // 5. BOOKING LOGIC
        async function handleBooking(id, phone) {
            // Optional: Update clicks_count in Supabase
            await _supabaseInstance.rpc('increment_clicks', { row_id: id });
            
            const msg = encodeURIComponent("Hi i saw your guesthouse at Accolink, I'm interested in booking a room in Pumpkinheads Guest House!");
            window.open(`https://wa.me/${phone}?text=${msg}`, '_blank');
        }

        // Start App
        getProperties();
    </script>
</body>
</html>
